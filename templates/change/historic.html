<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCI-DSS Changes Historic</title>
    <link rel="stylesheet" href="/change/historic-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <script src="/change/historic.js"></script>
</head>
<body>
    <header>
        <a href="/change" class="home-btn" title="Return to changes manager">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
        <h1>Changes Historic</h1>
    </header>
    <main>
        <div class="filters">
            <div class="filter-group">
                <label for="filter-type">Type:</label>
                <select id="filter-type">
                    <option value="all">All</option>
                    <option value="new">New Documents</option>
                    <option value="updated">Updated Versions</option>
                    <option value="removed">Removed Documents</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-category">Category:</label>
                <select id="filter-category">
                    <option value="all">All Categories</option>
                </select>
            </div>
        </div>

        <div id="historic-container">
            <div class="loading">Loading historic data...</div>
        </div>
    </main>
</body>
</html>
